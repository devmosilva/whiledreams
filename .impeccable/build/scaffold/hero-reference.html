<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: loop-essential-a.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Giga:wght@700&family=Atkinson+Hyperlegible:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <div class="r-nav-brand region chrome" data-region="nav-brand"><!-- símbolo plano azul-violeta e wordmark While Dreams alinhados à esquerda --></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- links Soluções, Projetos, Como trabalhamos e Sobre em uma linha --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- botão azul-marinho Conte sua ideia com seta: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline-transform region text" data-region="headline-transform"><!-- primeira linha monumental Transformamos em azul-marinho --><p style="font-size:var(--r-headline-transform-font);font-family:var(--r-headline-transform-family),sans-serif;font-weight:var(--r-headline-transform-weight);line-height:1.05;margin:0">headline-transform</p></div>
  <div class="r-headline-ideas region text" data-region="headline-ideas"><!-- segunda linha monumental ideias em em azul-marinho --><p style="font-size:var(--r-headline-ideas-font);font-family:var(--r-headline-ideas-family),sans-serif;font-weight:var(--r-headline-ideas-weight);line-height:1.05;margin:0">headline-ideas</p></div>
  <div class="r-headline-tech region text" data-region="headline-tech"><!-- terceira linha monumental tecnologia em violeta --><p style="font-size:var(--r-headline-tech-font);line-height:1.05;margin:0">headline-tech</p></div>
  <div class="r-hero-subhead region text" data-region="hero-subhead"><!-- subheadline cinza em três linhas explicando sites, sistemas, automações e IA --><p style="font-size:var(--r-hero-subhead-font);line-height:1.05;margin:0">hero-subhead</p></div>
  <div class="r-hero-primary region control" data-region="hero-primary"><!-- botão azul-marinho Conte sua ideia: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-primary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-secondary region control" data-region="hero-secondary"><!-- botão branco contornado Conheça nossas soluções: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-secondary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-proof region text" data-region="hero-proof"><!-- linha editorial Estratégia, Produto e Tecnologia com separadores --><p style="line-height:1.05;margin:0">hero-proof</p></div>
  <div class="r-loop-core region chrome" data-region="loop-core"><!-- símbolo plano em fita azul-violeta formando o loop central da marca --></div>
  <div class="r-branch-sites region chrome" data-region="branch-sites"><!-- ramificação superior violeta com ponto terminal e ícone simples de site --></div>
  <div class="r-sites-copy region text" data-region="sites-copy"><!-- título Sites e frase Presença que gera resultados --><p style="font-size:var(--r-sites-copy-font);line-height:1.05;margin:0">sites-copy</p></div>
  <div class="r-branch-systems region chrome" data-region="branch-systems"><!-- ramificação central violeta com ponto terminal e ícone simples de sistema --></div>
  <div class="r-systems-copy region text" data-region="systems-copy"><!-- título Sistemas e frase Soluções feitas para o seu negócio --><p style="font-size:var(--r-systems-copy-font);line-height:1.05;margin:0">systems-copy</p></div>
  <div class="r-branch-automation region chrome" data-region="branch-automation"><!-- ramificação violeta com ponto terminal e ícone simples de automação --></div>
  <div class="r-automation-copy region text" data-region="automation-copy"><!-- título Automação e frase Processos que trabalham por você --><p style="font-size:var(--r-automation-copy-font);line-height:1.05;margin:0">automation-copy</p></div>
  <div class="r-branch-ai region chrome" data-region="branch-ai"><!-- ramificação inferior violeta com ponto terminal e ícone simples de inteligência artificial --></div>
  <div class="r-ai-copy region text" data-region="ai-copy"><!-- título IA aplicada e frase Inteligência para decisões reais --><p style="font-size:var(--r-ai-copy-font);line-height:1.05;margin:0">ai-copy</p></div>
</main>
</body>
</html>
